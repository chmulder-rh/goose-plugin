version: "1.0.0"
title: "Jira Issue Creator"
description: "Creates a RHCLOUD Jira issue via createJiraIssue MCP. Receives pre-validated, pre-mapped field values. Uses ATLASSIAN_INSTANCE environment variable for cloudId."

parameters:
  - key: mapped_summary
    input_type: string
    requirement: required
    description: "Final summary with prefix applied (if any)"

  - key: issue_type
    input_type: string
    requirement: required
    description: "Jira issue type, e.g. 'Story', 'Bug'"

  - key: team_field_value
    input_type: string
    requirement: required
    description: "UUID for customfield_10001 (already mapped by validate_and_map_fields.py)"

  - key: activity_type_field_value
    input_type: string
    requirement: required
    description: "JSON object {\"value\": \"...\"} for customfield_10464"

  - key: security_field_value
    input_type: string
    requirement: optional
    default: ""
    description: "JSON object {\"name\": \"...\"} or empty string if not applicable"

  - key: assignee_account_id
    input_type: string
    requirement: required
    description: "Jira account ID or 'unassigned'"

prompt: |
  createJiraIssue(
    cloudId=$(printenv ATLASSIAN_INSTANCE),
    projectKey="RHCLOUD",
    issueTypeName={{ issue_type }},
    summary={{ mapped_summary }},
    assignee_account_id={{ assignee_account_id }},
    additional_fields={
      "customfield_10001": {{ team_field_value }},
      "customfield_10464": {{ activity_type_field_value }},
      {% if security_field_value %}
      "security": {{ security_field_value }}
      {% endif %}
    }
  )
  // Report result via response.json_schema: {success, issue_key, issue_url, error}

extensions:
  - type: streamable_http
    name: atlassian-rovo
    uri: https://mcp.atlassian.com/v1/mcp/authv2
    timeout: 300
    headers:
      Authorization: $ATLASSIAN_AUTH
    env_keys:
      - ATLASSIAN_AUTH
    envs:
      ATLASSIAN_CLOUD_ID: $ATLASSIAN_CLOUD_ID
      ATLASSIAN_INSTANCE: $ATLASSIAN_INSTANCE

response:
  json_schema:
    type: object
    properties:
      success:
        type: boolean
        description: "True if the ticket was created successfully"
      issue_key:
        type: string
        description: "The created ticket's key, e.g. RHCLOUD-1234; empty string on failure"
      issue_url:
        type: string
        description: "The browse URL for the created ticket; empty string on failure"
      error:
        type: string
        description: "Description of the failure; empty string on success"
    required:
      - success
      - issue_key
      - issue_url
      - error
