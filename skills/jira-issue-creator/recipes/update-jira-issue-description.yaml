version: "1.0.0"
title: "Jira Issue Description Updater"
description: "Updates a RHCLOUD Jira issue description via editJiraIssue MCP. Uses ATLASSIAN_CLOUD_ID for cloudId."

parameters:
  - key: issue_key
    input_type: string
    requirement: required
    description: "Jira issue key (e.g., RHCLOUD-1234)"

  - key: description
    input_type: string
    requirement: required
    description: "Markdown description text"

  - key: atlassian_cloud_id
    input_type: string
    requirement: required
    description: "Atlassian Cloud site ID (UUID)"

prompt: |
  rovo__editJiraIssue(
    cloudId={{ atlassian_cloud_id }},
    issueIdOrKey={{ issue_key }},
    contentFormat="markdown",
    fields={"description": {{ description }}}
  )
  // Report result via response.json_schema: {success, error}

extensions:
  - type: streamable_http
    name: rovo
    display_name: "Atlassian Rovo MCP Server"
    description: "MCP server for Atlassian Jira and Confluence integration"
    uri: https://mcp.atlassian.com/v2/mcp
    scopes:
      - read:jira:agent-interface
      - write:jira:agent-interface
      - search:jira:agent-interface
    timeout: 300

response:
  json_schema:
    type: object
    properties:
      success:
        type: boolean
        description: "True if the description was updated successfully"
      error:
        type: string
        description: "Description of the failure; empty string on success"
    required:
      - success
      - error
